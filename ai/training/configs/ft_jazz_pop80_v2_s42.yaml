# F1 v2 restoration seed run #1 / seed 42 on the R3-EXPANDED (9-src) corpus.
# Purpose: bring the original published v2 (seed 42, trained on the OLD 6-src data)
# onto the SAME 9-src data as s2 (seed 123) / s3 (seed 7), completing a clean
# identical-except-seed n=3 multi-seed for the jazz_val-selection robustness claim
# Identical recipe to ft_jazz_pop80_v2_s2.yaml,
# only seed + run_name differ. Run on the 9-src splits (choco + bunks in JAZZ_SOURCES).
run_name: ft_jazz_pop80_v2_s42
seed: 42
resume_from: checkpoints/phase0_pop_baseline/best.pt
pop_mix_count: 10000
select_best_on: jazz_val
epochs: 10
batch_size: 64
gradient_accumulation_steps: 2
lr: 2.0e-5
weight_decay: 0.01
warmup_epochs: 2
max_grad_norm: 1.0
d_model: 512
n_heads: 8
d_ff: 2048
n_layers: 8
max_seq_len: 256
dropout: 0.1
use_amp: true
checkpoint_every: 1
patience: 5
num_workers: 2
persistent_workers: false
prefetch_factor: 2
log_every_steps: 200
