run_name: ft_jazz_pop50_v2
tokenizer_version: v2
resume_from: checkpoints/phase0_v2_pop_baseline/best.pt
pop_mix_count: 2500
epochs: 10
batch_size: 48
gradient_accumulation_steps: 3
lr: 2.0e-5
weight_decay: 0.01
warmup_epochs: 2
max_grad_norm: 1.0
d_model: 512
n_heads: 8
d_ff: 2048
n_layers: 8
max_seq_len: 384
dropout: 0.1
use_amp: true
checkpoint_every: 1
patience: 5
num_workers: 4
persistent_workers: true
prefetch_factor: 4
log_every_steps: 200
# F3 sweet-spot fine-tune under enriched tokenizer v2. Requires the
# R3 expanded jazz corpus (5,275 jazz songs) and the v2 Phase 0
# baseline. Same 2.5K pop rehearsal recipe as v1.
