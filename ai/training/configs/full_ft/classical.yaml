# Full fine-tune on F1 base, target genre: classical
# Comparison baseline for the LoRA parameter-efficiency claim.
# Reuses lora_train.py with disable_lora=true.
#
# lr is 30× lower than the LoRA run (3e-4 → 1e-5) to slow catastrophic
# forgetting of the base's pop/jazz fluency. Forgetting is *quantified
# post-hoc* by re-evaluating the saved checkpoint on the pop and jazz
# validation splits (separate eval pass, not in this training loop).

run_name: ft_f1_full_ft_classical

base_checkpoint: checkpoints/ft_jazz_pop80/best.pt
target_genre: classical
sources: ["chordonomicon_classical"]

d_model: 512
n_heads: 8
d_ff: 2048
n_layers: 8
max_seq_len: 256
dropout: 0.1

disable_lora: true

epochs: 5
batch_size: 32
gradient_accumulation_steps: 2
lr: 1.0e-5
weight_decay: 0.01
warmup_epochs: 1
max_grad_norm: 1.0
use_amp: true
num_workers: 4
