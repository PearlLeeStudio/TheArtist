# Full fine-tune on F1 base, target genre: rock
# Comparison baseline for the LoRA parameter-efficiency claim.
# Same hyperparameters as classical (lr=1e-5,
# 5 epochs), but the corpus is ~130× larger so wall time is correspondingly
# longer (~5 hours vs ~30 min). Rock is the low-gain end of the LoRA
# study; the full-FT comparison tells us whether the LoRA's small gain
# on rock is a ceiling (full FT also gains little) or a capacity limit
# (full FT gains substantially more).

run_name: ft_f1_full_ft_rock

base_checkpoint: checkpoints/ft_jazz_pop80/best.pt
target_genre: rock
sources: ["chordonomicon_rock"]

d_model: 512
n_heads: 8
d_ff: 2048
n_layers: 8
max_seq_len: 256
dropout: 0.1

disable_lora: true

epochs: 5
batch_size: 32
gradient_accumulation_steps: 2
lr: 1.0e-5
weight_decay: 0.01
warmup_epochs: 1
max_grad_norm: 1.0
use_amp: true
num_workers: 4
