run_name: phase0_pop_baseline
sources: [chordonomicon, billboard]
epochs: 3
batch_size: 64
gradient_accumulation_steps: 2
lr: 3.0e-4
weight_decay: 0.01
warmup_epochs: 1
max_grad_norm: 1.0
d_model: 512
n_heads: 8
d_ff: 2048
n_layers: 8
max_seq_len: 256
dropout: 0.1
use_amp: true
checkpoint_every: 1
patience: 2
num_workers: 4
persistent_workers: true
prefetch_factor: 4
log_every_steps: 500
