# Smoke config for the select_best_on=jazz_val code path — NOT a real experiment.
# Tiny pop mix + 1 epoch; validates jazz-val loader, selection, CSV/TB columns.
run_name: ft_jazz_pop80_v2_smoke
resume_from: checkpoints/phase0_pop_baseline/best.pt
pop_mix_count: 200
select_best_on: jazz_val
# resume sets start_epoch=3 (phase0 best is epoch 2) — epochs:4 runs exactly one
# fine-tune epoch (3); epochs:1 would make the loop range empty.
epochs: 4
batch_size: 64
gradient_accumulation_steps: 2
lr: 2.0e-5
weight_decay: 0.01
warmup_epochs: 1
max_grad_norm: 1.0
d_model: 512
n_heads: 8
d_ff: 2048
n_layers: 8
max_seq_len: 256
dropout: 0.1
use_amp: true
checkpoint_every: 1
patience: 5
num_workers: 2
persistent_workers: false
prefetch_factor: 2
log_every_steps: 50
