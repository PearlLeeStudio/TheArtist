# LoRA fine-tune: F1 base + funk adapter
# Pearl 2026-05-09 — Pearl 개인 선호로 별 LoRA. ~1.5K from Chordonomicon `genres` funk subtag.
# 결과 약하면 fuzzy expansion (genres에 funk-rock/funk-metal 포함) + Lakh fishing 추가 검토.

run_name: ft_f1_lora_funk_r16_seed7

base_checkpoint: checkpoints/ft_jazz_pop80/best.pt
target_genre: funk
sources: ["chordonomicon_funk"]

d_model: 512
n_heads: 8
d_ff: 2048
n_layers: 8
max_seq_len: 256
dropout: 0.1

lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules: ["w_q", "w_k", "w_v"]

# 데이터 적어서 epoch 더 길게
epochs: 8
batch_size: 32
gradient_accumulation_steps: 2
lr: 3.0e-4
weight_decay: 0.01
warmup_epochs: 1
max_grad_norm: 1.0
use_amp: true
num_workers: 4
seed: 7
