# BitFit PEFT comparison: rock
# BitFit = train all .bias parameters (+ extra genre embedding rows).

run_name: ft_f1_bitfit_rock

base_checkpoint: checkpoints/ft_jazz_pop80/best.pt
target_genre: rock
sources: ["chordonomicon_rock"]

d_model: 512
n_heads: 8
d_ff: 2048
n_layers: 8
max_seq_len: 256
dropout: 0.1

peft_method: bitfit

epochs: 8
batch_size: 32
gradient_accumulation_steps: 2
lr: 3.0e-4
weight_decay: 0.01
warmup_epochs: 1
max_grad_norm: 1.0
use_amp: true
num_workers: 4
