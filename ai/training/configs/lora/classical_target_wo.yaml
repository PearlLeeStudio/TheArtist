# LoRA fine-tune: F1 base + classical adapter
# Pearl 2026-05-10 — Chordonomicon에 classical 없음. 대안으로 Bach 371 chorales
# (music21 corpus, public domain)를 extract_bach_chorales.py로 추출.
# Bach가 classical 전체는 아니지만 functional harmony 정수 — secondary dominants,
# voice leading, modal mixture 다 갖고 있어서 chord LoRA에 충분.

run_name: ft_f1_lora_classical_target_wo

base_checkpoint: checkpoints/ft_jazz_pop80/best.pt
target_genre: classical
sources: ["chordonomicon_classical"]  # naming convention; 실제 데이터는 Bach chorales

d_model: 512
n_heads: 8
d_ff: 2048
n_layers: 8
max_seq_len: 256
dropout: 0.1

lora_r: 8
lora_alpha: 16
lora_dropout: 0.05
lora_target_modules: ["w_q", "w_k", "w_v", "w_o"]

# 작은 데이터셋 (~371 곡) — gospel/funk와 비슷한 size, 더 많은 epoch로 학습
epochs: 8
batch_size: 32
gradient_accumulation_steps: 2
lr: 3.0e-4
weight_decay: 0.01
warmup_epochs: 1
max_grad_norm: 1.0
use_amp: true
num_workers: 4
