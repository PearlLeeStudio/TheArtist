# LoRA fine-tune: F1 base + classical adapter (LR ablation: lr=1e-4 vs default 3e-4)
# Pearl 2026-05-11 — original classical run hit best val at epoch 7/8 (still improving).
# Test: lower lr + more epochs → does plateau move?

run_name: ft_f1_lora_classical_lr1e4

base_checkpoint: checkpoints/ft_jazz_pop80/best.pt
target_genre: classical
sources: ["chordonomicon_classical"]

d_model: 512
n_heads: 8
d_ff: 2048
n_layers: 8
max_seq_len: 256
dropout: 0.1

lora_r: 8
lora_alpha: 16
lora_dropout: 0.05
lora_target_modules: ["w_q", "w_k", "w_v"]

epochs: 12
batch_size: 32
gradient_accumulation_steps: 2
lr: 1.0e-4
weight_decay: 0.01
warmup_epochs: 1
max_grad_norm: 1.0
use_amp: true
num_workers: 4
