# Full fine-tune on F1 base, target genre: funk
# PEFT comparison baseline (11-genre extension).

run_name: ft_f1_full_ft_funk

base_checkpoint: checkpoints/ft_jazz_pop80/best.pt
target_genre: funk
sources: ["chordonomicon_funk"]

d_model: 512
n_heads: 8
d_ff: 2048
n_layers: 8
max_seq_len: 256
dropout: 0.1

peft_method: full

epochs: 8
batch_size: 32
gradient_accumulation_steps: 2
lr: 1.0e-5
weight_decay: 0.01
warmup_epochs: 1
max_grad_norm: 1.0
use_amp: true
num_workers: 4
