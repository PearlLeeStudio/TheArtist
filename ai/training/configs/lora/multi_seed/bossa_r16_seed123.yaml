# LoRA fine-tune: F1 base + bossa (Latin 우산) strengthening adapter
# Pearl 2026-05-09 — 강화 LoRA. ~14K from Chordonomicon `genres` bossa/samba/latin/salsa/cumbia.

run_name: ft_f1_lora_bossa_r16_seed123

base_checkpoint: checkpoints/ft_jazz_pop80/best.pt
target_genre: bossa
sources: ["chordonomicon_bossa"]

d_model: 512
n_heads: 8
d_ff: 2048
n_layers: 8
max_seq_len: 256
dropout: 0.1

lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules: ["w_q", "w_k", "w_v"]

epochs: 8
batch_size: 32
gradient_accumulation_steps: 2
lr: 3.0e-4
weight_decay: 0.01
warmup_epochs: 1
max_grad_norm: 1.0
use_amp: true
num_workers: 4
seed: 123
