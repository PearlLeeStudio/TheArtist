# Phase 0 base + LoRA at selected rank, target genre: rnb_soul
# F1 base justification ablation for the LoRA case (paper headline method).
# Compares to F1+LoRA selected rank to test whether F1's jazz priors help LoRA.

run_name: phase0_lora_rnb_soul_r4

base_checkpoint: checkpoints/phase0_pop_baseline/best.pt
target_genre: rnb_soul
sources: ["chordonomicon_rnb_soul"]

d_model: 512
n_heads: 8
d_ff: 2048
n_layers: 8
max_seq_len: 256
dropout: 0.1

lora_r: 4
lora_alpha: 8
lora_dropout: 0.05
lora_target_modules: ["w_q", "w_k", "w_v"]

seed: 42

epochs: 8
batch_size: 32
gradient_accumulation_steps: 2
lr: 3.0e-4
weight_decay: 0.01
warmup_epochs: 1
max_grad_norm: 1.0
use_amp: true
num_workers: 4
