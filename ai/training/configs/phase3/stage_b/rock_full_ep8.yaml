# F2 Stage B epoch sensitivity: rock full ep=8

run_name: stageB_full_rock_ep8

base_checkpoint: checkpoints/ft_jazz_pop80/best.pt
target_genre: rock
sources: ["chordonomicon_rock"]

peft_method: full

seed: 42

d_model: 512
n_heads: 8
d_ff: 2048
n_layers: 8
max_seq_len: 256
dropout: 0.1

epochs: 8
batch_size: 64
gradient_accumulation_steps: 1
lr: 1.0e-05
weight_decay: 0.01
warmup_epochs: 1
max_grad_norm: 1.0
use_amp: true
num_workers: 4
