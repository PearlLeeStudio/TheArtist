# F2 Stage B epoch sensitivity: rock lora ep=3

run_name: stageB_lora_rock_ep3

base_checkpoint: checkpoints/ft_jazz_pop80/best.pt
target_genre: rock
sources: ["chordonomicon_rock"]

peft_method: lora
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules: ["w_q", "w_k", "w_v"]

seed: 42

d_model: 512
n_heads: 8
d_ff: 2048
n_layers: 8
max_seq_len: 256
dropout: 0.1

epochs: 3
batch_size: 64
gradient_accumulation_steps: 1
lr: 3.0e-04
weight_decay: 0.01
warmup_epochs: 1
max_grad_norm: 1.0
use_amp: true
num_workers: 4
