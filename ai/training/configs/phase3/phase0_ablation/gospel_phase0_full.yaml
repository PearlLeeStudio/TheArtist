# E2 Phase 0 + Full FT: F1 base justification ablation.
# Same as B2_full but starting from Phase 0 (no-jazz baseline) instead of F1.

run_name: phase0_full_ft_gospel

base_checkpoint: checkpoints/phase0_pop_baseline/best.pt
target_genre: gospel
sources: ["chordonomicon_gospel"]

peft_method: full

seed: 42

d_model: 512
n_heads: 8
d_ff: 2048
n_layers: 8
max_seq_len: 256
dropout: 0.1

epochs: 8
batch_size: 32
gradient_accumulation_steps: 2
lr: 1.0e-05
weight_decay: 0.01
warmup_epochs: 1
max_grad_norm: 1.0
use_amp: true
num_workers: 4
