# E1 Control-token baseline: only new genre token embeddings trainable.
# Tests "why not just genre tokens?" — adapter-less symbolic conditioning.

run_name: ft_f1_control_token_folk_seed42

base_checkpoint: checkpoints/ft_jazz_pop80/best.pt
target_genre: folk
sources: ["chordonomicon_folk"]

peft_method: embedding_only

seed: 42

d_model: 512
n_heads: 8
d_ff: 2048
n_layers: 8
max_seq_len: 256
dropout: 0.1

epochs: 8
batch_size: 32
gradient_accumulation_steps: 2
lr: 3.0e-04
weight_decay: 0.01
warmup_epochs: 1
max_grad_norm: 1.0
use_amp: true
num_workers: 4
