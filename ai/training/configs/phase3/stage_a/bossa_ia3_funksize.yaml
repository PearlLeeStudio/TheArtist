# F1 Stage A controlled sweep: bossa sub-sampled to funk-size
# Method: ia3

run_name: stageA_ia3_bossa_funksize

base_checkpoint: checkpoints/ft_jazz_pop80/best.pt
target_genre: bossa
sources: ["funksize_subsample_bossa"]

peft_method: ia3
ia3_target_modules: ["w_k", "w_v"]

seed: 42

d_model: 512
n_heads: 8
d_ff: 2048
n_layers: 8
max_seq_len: 256
dropout: 0.1

epochs: 5
batch_size: 64
gradient_accumulation_steps: 1
lr: 3.0e-04
weight_decay: 0.01
warmup_epochs: 1
max_grad_norm: 1.0
use_amp: true
num_workers: 4
