# F1 Stage A controlled sweep: rock sub-sampled to funk-size
# Method: bitfit

run_name: stageA_bitfit_rock_funksize

base_checkpoint: checkpoints/ft_jazz_pop80/best.pt
target_genre: rock
sources: ["funksize_subsample_rock"]

peft_method: bitfit

seed: 42

d_model: 512
n_heads: 8
d_ff: 2048
n_layers: 8
max_seq_len: 256
dropout: 0.1

epochs: 5
batch_size: 64
gradient_accumulation_steps: 1
lr: 3.0e-04
weight_decay: 0.01
warmup_epochs: 1
max_grad_norm: 1.0
use_amp: true
num_workers: 4
