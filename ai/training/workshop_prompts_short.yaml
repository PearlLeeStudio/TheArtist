# Shorter 2-bar genre-specific prompts. The longer 4-bar setups in
# workshop_prompts.yaml encourage the model to repeat the loop; these
# 2-bar setups leave more room for divergence between F1-base and F1+LoRA.

- name: blues_short
  song:
    key: Bbmaj
    time_signature: "4/4"
    genre: blues
    bars: [["Bb7"], ["Eb7"]]

- name: bossa_short
