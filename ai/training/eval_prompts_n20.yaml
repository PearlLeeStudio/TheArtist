# N=20 evaluation prompt set for the author blind-pairwise-ranking
# validation step (theory_coherence_metric.md §5). Covers jazz (10),
# pop (6), and edge cases (4). Mix of keys and time signatures to
# avoid key-invariance illusion. Each prompt gives the model 2-4 bars
# of context so it has to continue, not repeat the seed.

# ------------------------- Jazz (10) -------------------------
- name: jazz_ii_V_I_major
  song:
    key: Cmaj
    time_signature: "4/4"
    genre: jazz
    bars: [["Dm7", "G7"], ["Cmaj7"]]

- name: jazz_ii_V_i_minor
  song:
    key: Amin
    time_signature: "4/4"
    genre: jazz
    bars: [["Bm7b5", "E7"], ["Am7"]]

