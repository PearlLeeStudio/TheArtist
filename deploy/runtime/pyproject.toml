[project]
name = "theartist-cpu-runtime"
version = "0.1.0"
description = "CPU serving dependencies, excluding unused embedding/vector research services"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "pydantic==2.13.4",
    "uvicorn==0.52.1",
    "torch==2.13.0",
    "numpy==2.5.1",
    "music21==10.5.0",
    "peft==0.20.0",
    "mido==1.3.3",
    "mcp==1.30.0",
    "pdfplumber==0.11.10",
    "huggingface-hub==1.27.0",
    "scipy>=1.17,<2",
    "pyyaml>=6,<7",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
